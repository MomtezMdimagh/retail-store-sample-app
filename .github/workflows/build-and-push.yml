name: Build and push service images

on:
  push:
    branches: [main]
    paths:
      - "src/cart/**"
      - "src/catalog/**"
      - "src/checkout/**"
      - "src/orders/**"
      - "src/ui/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            cart:
              - 'src/cart/**'
            catalog:
              - 'src/catalog/**'
            checkout:
              - 'src/checkout/**'
            orders:
              - 'src/orders/**'
            ui:
              - 'src/ui/**'

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::652197205931:role/github-oidc-provider-aws
          aws-region: us-east-1

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2.1.7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Compute short SHA tag
        id: tag
        run: echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: src/${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/retail-store/${{ matrix.service }}:${{ steps.tag.outputs.sha }}
            ${{ steps.ecr-login.outputs.registry }}/retail-store/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate a token for the platform repo
        id: platform-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ vars.PLATFORM_REPO_APP_ID }}
          private-key: ${{ secrets.PLATFORM_REPO_APP_PRIVATE_KEY }}
          owner: MomtezMdimagh
          repositories: retail-store-eks-platform

      - name: Check out the platform repo
        uses: actions/checkout@v7.0.1
        with:
          repository: MomtezMdimagh/retail-store-eks-platform
          token: ${{ steps.platform-token.outputs.token }}
          path: platform-repo

      - name: Update the image tag and push, retrying on a race with another matrix job
        working-directory: platform-repo
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            yq -i '.image.tag = strenv(TAG)' \
              "gitops/environments/dev/values/values-${{ matrix.service }}.yaml"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "gitops/environments/dev/values/values-${{ matrix.service }}.yaml"
            if git diff --cached --quiet; then
              echo "No change to commit"
              break
            fi
            git commit -m "chore: bump ${{ matrix.service }} image tag to ${TAG} [skip ci]"
            if git push origin main; then
              break
            fi
            echo "Push rejected, pulling and retrying ($attempt/5)"
            git fetch origin main
            git reset --soft origin/main
            sleep $((attempt * 3))
          done
        env:
          TAG: ${{ steps.tag.outputs.sha }}
